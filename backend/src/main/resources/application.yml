server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: trace-log-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      enabled: false
  mvc:
    async:
      request-timeout: 300000  # 流式导出的异步请求超时（毫秒）

trace-log:
  # 异步写入缓冲队列（达到 batch-size 或 flush-interval 即批量写入 OpenObserve）
  buffer:
    capacity: 10000          # 队列容量，写满后按 DROP 策略丢弃并计数，绝不阻塞业务请求
    batch-size: 200          # 单次批量写入条数
    flush-interval-ms: 1000  # 未凑满 batch 时的最大等待时间
    worker-count: 2          # 后台写线程数

  # API Key 鉴权（fail-closed：key 未配置则一律 401；本地冒烟可用 enabled=false 临时关闭）
  # 生产环境用环境变量注入：TRACE_LOG_SECURITY_API_KEYS_0_NAME / _KEY / _PERMISSIONS / _SERVICE / _ENVIRONMENT
  security:
    enabled: true
    api-keys:
      - name: admin
        key: ${TRACE_LOG_ADMIN_KEY:}
        permissions: [log:write, log:read, trace:read, dashboard:read, log:export]
      - name: writer
        key: ${TRACE_LOG_WRITER_KEY:}
        permissions: [log:write]
      - name: reader
        key: ${TRACE_LOG_READER_KEY:}
        permissions: [log:read, trace:read, dashboard:read, log:export]

  # 请求与查询限制
  limits:
    max-log-bytes: 65536            # 单条日志 64 KB
    max-batch-bytes: 5242880        # 单批 5 MB
    max-batch-records: 500          # 单批最大 500 条
    search-default-size: 50
    search-max-size: 500
    search-default-range-minutes: 15
    search-max-range-days: 7
    dashboard-default-range-minutes: 60
    dashboard-max-range-hours: 24
    export-max-rows: 100000
    export-max-range-hours: 24
    export-page-size: 1000
    trace-max-logs: 5000

  storage:
    openobserve:
      base-url: ${OPENOBSERVE_URL:http://localhost:5080}
      organization: ${OPENOBSERVE_ORG:default}
      stream-name: ${OPENOBSERVE_STREAM:trace_logs}
      username: ${OPENOBSERVE_USERNAME:}   # 通过环境变量注入，仓库不保存凭据
      password: ${OPENOBSERVE_PASSWORD:}
      token: ""                            # 可选：改用 Bearer token（优先于 Basic）
      connect-timeout-ms: 500
      write-timeout-ms: 5000
      query-timeout-ms: 10000
      health-timeout-ms: 2000
      retry:
        max-attempts: 3
        backoff-ms: [100, 500, 2000]

  cors:
    # 开发模式 Vite 前端跨域；生产经 nginx 反向代理同源，无需配置
    allowed-origins: ${TRACE_LOG_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.obsroman.tracelog: INFO
