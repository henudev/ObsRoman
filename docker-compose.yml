name: obsroman-trace-log

services:
  openobserve:
    image: openobserve/openobserve:latest
    container_name: obsroman-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${OO_ROOT_USER_EMAIL:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${OO_ROOT_USER_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
    volumes:
      - oo-data:/data
    ports:
      - "5080:5080"
    # 说明：OpenObserve 官方镜像为 distroless（无 shell/wget），无法做容器内健康检查；
    # 后端对 OO 故障具备降级能力（/ready=DEGRADED，不崩溃），OO 启动约需数秒后自动恢复。
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: obsroman-backend
    depends_on:
      - openobserve
    environment:
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_ORG: default
      OPENOBSERVE_STREAM: trace_logs
      OPENOBSERVE_USERNAME: ${OO_ROOT_USER_EMAIL:-root@example.com}
      OPENOBSERVE_PASSWORD: ${OO_ROOT_USER_PASSWORD:-Complexpass#123}
      # API Key（以下默认值仅供本地开发联调，生产必须覆盖）
      TRACE_LOG_ADMIN_KEY: ${TRACE_LOG_ADMIN_KEY:-dev-admin-key}
      TRACE_LOG_WRITER_KEY: ${TRACE_LOG_WRITER_KEY:-dev-writer-key}
      TRACE_LOG_READER_KEY: ${TRACE_LOG_READER_KEY:-dev-reader-key}
      # CORS：compose 前端(3000) + 本地 Vite 开发(5173)
      TRACE_LOG_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      TZ: Asia/Shanghai
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DEFAULT_API_KEY: ${TRACE_LOG_READER_KEY:-dev-reader-key}
    container_name: obsroman-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  oo-data:
