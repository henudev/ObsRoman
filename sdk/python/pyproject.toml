[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-log-sdk"
version = "1.2.0"
description = "Zero-dependency Python SDK for Trace Log Service (async batching, retry, W3C Trace Context)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ObsRoman" }]
keywords = ["logging", "tracing", "openobserve"]

[tool.setuptools.packages.find]
include = ["trace_log_sdk*"]
